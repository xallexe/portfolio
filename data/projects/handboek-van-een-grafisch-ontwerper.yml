info: een handboek van een grafisch ontwerper is een boek met al de afbeeldingen
  uit mijn fotogalerij, die een hand en een boek tonen. deze foto’s zijn
  voornamelijk getrokken tijdens mijn studie, grafisch ontwerp. ik hoop dat vele
  grafisch ontwerpers zichzelf en hun galerij kunnen herkennen. hopelijk hebben
  de lezers een kleine glimlach bij het bekijken van dit boek.
