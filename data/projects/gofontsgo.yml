info: tijdens mijn masteropleiding kreeg ik de kans om samen te werken met
  grafische cel. grafische cel is de uitgeverij van onze afdeling grafisch
  ontwerp aan luca gent. frederik berlaen, mijn docent letterontwerp, wilde van
  elk lettertype dat sinds het jaar waarin hij in luca begon, was ontworpen, een
  boekje maken. hij begon dus in 2007 en gaat daar tot op heden mee door. ik heb
  het boek gemaakt op basis van de lettertypes die in 2007–2008 zijn ontworpen.
  de lettertypes waren niet (allemaal) voltooid, omdat de cursus slechts zes
  weken duurde; sommige hadden geen kapitalen, andere geen leestekens, dus moest
  ik een beetje creatief zijn. ik heb mijn boek rond tennis opgebouwd, omdat ik
  één les over sport had en ik in een soort tennis-obsessie terechtkwam. met die
  obsessie heb ik het boek ontworpen. samen met vijf andere studenten (de andere
  studenten maakten boeken over een ander jaar) kregen we de kans om een kleine
  tentoonstelling te organiseren op de art book fair in gent.
info_en: during my master’s program, i got the chance to collaborate with
  grafische cel. grafische cel is the publishing house of our graphic design
  department at luca gent. frederik berlaen, my type design teacher, wanted to
  make a booklet for each typeface that had been designed since the year he
  started at luca. he started in 2007 and is still going at it to this day. i
  made the book based on the typefaces designed in 2007–2008. the typefaces were
  not (all) finished, because the course only lasted six weeks; some had no
  capitals, others no punctuation, so i had to be a bit creative. i built my
  book around tennis, because i had one class on sports and i ended up in a bit
  of a tennis obsession. with that obsession, i designed the book. together with
  five other students (the other students made books about a different year), we
  got the chance to organize a small exhibition at the art book fair in gent.
