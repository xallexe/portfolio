info: >-
  vaak word ik gestoord door de witruimte in het boek. er is vaak (bijn altijd)
  een te kort aan witruimte in een boek, ik weet niet waarom. misschien hebben
  veel mensen een angst voor de *witte pagina.* maar ik vind net dat deze ruimte
  extra moet gecreërd worden. 


  ik ging op zoek naar een boek die mentaal zwaar was. ik werd verbruikt licht van lara pawson aangeraden door een werknemer in mijn lokale boekenhandel. natuurlijk nadat hij een boek van samuel beckett had aangeraden. 


  bij het lezen van dit boek, verbruikt licht, telkens ik verbaaasd was door de gruwel die werd omschreven, maakte ik een witruimte. ik wil de lezer de tijd geven om te beseffen wat die net las. 


  ik wil dat de zwaarte de ruimte krijgt om te bestaan en de lezer deze kan voelen.
