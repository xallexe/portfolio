info: >-
  vaak word ik gestoord door de witruimte in het boek. er is vaak (bijn altijd)
  een te kort aan witruimte in een boek, ik weet niet waarom. misschien hebben
  veel mensen een angst voor de *witte pagina.* maar ik vind net dat deze ruimte
  extra moet gecreërd worden. 


  ik ging op zoek naar een boek die mentaal zwaar was. ik werd verbruikt licht van lara pawson aangeraden door een werknemer in mijn lokale boekenhandel. natuurlijk nadat hij een boek van samuel beckett had aangeraden. 


  bij het lezen van dit boek, verbruikt licht, telkens ik verbaaasd was door de gruwel die werd omschreven, maakte ik een witruimte. ik wil de lezer de tijd geven om te beseffen wat die net las. 


  ik wil dat de zwaarte de ruimte krijgt om te bestaan en de lezer deze kan voelen.
info_en: >-
  often i get disturbed by the whitespace in a book. there's often (almost
  always) too little whitespace in a book, i don't know why. maybe many people
  have a fear of the white page. but i think this space should actually be
  created more.


  i was looking for a book that was heavy, mentally speaking, a text that is difficult to read. i was recommended spent light by lara pawson by an employee at my local bookstore. of course after he had recommended a book by samuel beckett.


  while reading this book, spent light, every time i was shocked by the horror that was described, i created a space. i want to give the reader time to realize what they just read.


  i want the heaviness to have the space to exist and for the reader to be able to feel it.
