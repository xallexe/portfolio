klant: bruikleen publicaties
info_en: >-
  i love literature, but who doesn't ? 


  there is this thing called a memoir and everytime i read one of those, i feel like the author is speaking to me.


  i wanted to do something with this beautiful story of simone de beauvoir who lost her mother.


  i took the words away: a, very, easy and death. i took away what the story was about by removing these words.


  i wanted it to remain fragile.


  if somebody dies, you have to fill up an empty space in your heart and your life. i made the empty spaces in the book so the reader has to fill them in again. because even if it is an easy death, the empty space will still be there and it will still hurt like hell.
