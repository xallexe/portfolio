# Portfolio data — edit project names, titles, mediums, and clients here.
# Photo files live in ../assets/photos/.
#
# Each project has:
#   id      — internal identifier (used for anchor links, don't change once set)
#   order   — onderliggend volgnummer. Bepaalt de kolom: oneven → linkerkolom,
#             even → rechterkolom. Blijf bestaan ook als `name` verandert.
#   column  — OPTIONEEL. Forceer een kolom: "a" (links) of "b" (rechts).
#             Overschrijft de pariteit van `order`.
#   name    — short label shown in the left navigation
#   title   — fuller title shown in the info line under the project on the page
#   medium  — e.g. "Fotografie", "Print", "Mixed media"
#   klant   — opdrachtgever / client (leeg laten als persoonlijk werk)
#   info    — vrije omschrijving onder titel/medium/klant
#   photos  — list of files (in order of appearance), with optional per-photo info
#
# Add/remove/rename projects freely. The site rebuilds from this file.

